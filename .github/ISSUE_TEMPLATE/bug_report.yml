name: Bug report
description: Report something that does not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please check that a similar issue does not already exist.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen?
      placeholder: Marking an object busy returns a 500 error...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as the administrator
        2. Open an object and click "Mark as taken"
        3. Observe the error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Git commit hash, release tag, or the output of `git rev-parse HEAD`.
      placeholder: a1b2c3d
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Go version, browser (if frontend related).
      placeholder: |
        OS: Linux
        Go version: go1.24.0
        Browser: Firefox 140
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Server logs, stack traces, or API responses. Please remove secrets.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this has not been reported.
          required: true
        - label: I can reproduce the problem with the latest commit.
          required: false
